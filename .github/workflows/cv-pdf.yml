name: CV PDF

# Renders cv.pdf (linked from the portfolio) from .github/cv/cv.html
on:
  push:
    branches: [main]
    paths: ['.github/cv/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Render cv.pdf
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              await page.goto("file://" + process.cwd() + "/.github/cv/cv.html", { waitUntil: "networkidle" });
              await page.evaluate(() => document.fonts.ready);
              await page.pdf({ path: "cv.pdf", format: "A4", printBackground: true, preferCSSPageSize: true });
              await browser.close();
            })();
          '
          ls -l cv.pdf
      - name: Commit cv.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git diff --cached --quiet || { git commit -m "Render cv.pdf"; git push; }
