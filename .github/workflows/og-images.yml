name: Social preview images

# Renders the Open Graph images of the /automation/ pages from the templates in .github/og/
on:
  push:
    branches: [main]
    paths: ['.github/og/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx -y playwright@1.56.0 install --with-deps chromium
      - name: Render 1200x630 images
        run: |
          for f in .github/og/og-*.html; do
            name=$(basename "$f" .html)
            npx -y playwright@1.56.0 screenshot --viewport-size "1200, 630" --wait-for-timeout 4000 "file://$PWD/$f" "automation/assets/$name.png"
          done
          ls -l automation/assets/*.png
      - name: Commit the images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add automation/assets/og-*.png
          git diff --cached --quiet || { git commit -m "Render social preview images"; git push; }
